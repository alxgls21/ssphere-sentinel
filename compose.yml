# SSphere Sentinel server: the console (React, served by nginx) and Django
# (Gunicorn) + PostgreSQL.
#
#   cp .env.example .env        # then set every secret (docs/server-deployment.md)
#   docker compose up -d --build
#
# The proxy service is the only one published, on SENTINEL_HTTP_BIND:SENTINEL_HTTP_PORT
# (default: all interfaces, port 8000): it serves the console and passes /api/,
# /admin/, /static/ and /health/ on to web. Browsers and agents use it alone. It
# shares the edge network with web only; PostgreSQL and the workers are on the
# internal Compose network, which it cannot reach. In production, terminate TLS
# in front of it (reverse proxy or Cloudflare Tunnel, see compose.tunnel.yml) and
# set SENTINEL_HTTP_BIND=127.0.0.1.
#
# The database service comes from deploy/postgres/postgres-<SENTINEL_POSTGRES>.yml.
# Each file defines the image, the volume and the mount of one PostgreSQL major
# version together, so they cannot be combined wrongly. New installations get
# PostgreSQL 18 from .env.example. Without SENTINEL_POSTGRES this file keeps the
# PostgreSQL 16 service (and its postgres_data volume) an existing installation
# already runs, so updating the repository never changes its database. Moving to
# PostgreSQL 18 is a dump and restore into a new volume, see
# docs/server-deployment.md. Keep the service and volume names: renaming them
# would start a new, empty database volume.
#
# The one-shot migrate service runs before web on every `docker compose up` and
# exits. With the default SENTINEL_DB_ROLES (legacy) it has nothing to do: web
# applies the migrations as it starts. With SENTINEL_DB_ROLES=separate it applies
# them with its own login, whose secrets live in the file SENTINEL_MIGRATE_ENV_FILE
# names; web never reads that file (sentinel/database.py).
#
# With the separate logins no application container holds the bootstrap
# superuser's password: .env no longer has it, and the file
# SENTINEL_BOOTSTRAP_ENV_FILE names does, which Compose reads for the database
# service only, to resolve POSTGRES_PASSWORD. Each service blanks the password
# it must not get, should it be in .env by mistake, and every Sentinel process
# refuses to start with a password not its own (docs/server-deployment.md).
#
# alert-engine evaluates the alert rules and opens and recovers incidents; the
# optional notifier (profile "notifications") emails them; the optional
# domain-verifier (profile "web-monitoring") answers the domain verifications
# asked for in the console, from each domain's own name servers. They run the
# application image with the runtime login, like web, and never apply
# migrations (SENTINEL_PROCESS=worker): they start with web and wait until the
# migrations are applied, by web or, with the separate logins, by migrate.
# The SMTP password reaches the notifier only (docs/server-deployment.md).

include:
  - path: deploy/postgres/postgres-${SENTINEL_POSTGRES:-16}.yml
    project_directory: .
    # The values the database file is resolved with: never an env_file of a service.
    env_file:
      - .env
      - ${SENTINEL_BOOTSTRAP_ENV_FILE:-deploy/compose/no-bootstrap-secrets.env}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  # The front door's network: proxy and web (and cloudflared, compose.tunnel.yml).
  edge: {}

services:
  migrate:
    build: .
    command: ["apply-migrations"]
    restart: "no"
    init: true
    env_file:
      - .env
      # Never .env itself: Compose before 2.24 refuses a file listed twice.
      - ${SENTINEL_MIGRATE_ENV_FILE:-deploy/compose/no-migration-secrets.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SENTINEL_DB_ACCESS: migrate
      # The runtime login's password belongs to web and the workers only.
      SENTINEL_DB_PASSWORD: ""
      SENTINEL_SMTP_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
    # The image's health check probes Gunicorn, which this service never runs.
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  web:
    build: .
    restart: unless-stopped
    # Minimal init as PID 1: forwards SIGTERM to Gunicorn and reaps children.
    init: true
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SENTINEL_DB_ACCESS: runtime
      # The migration login's password belongs to the migrate service only,
      # even when it was put in .env by mistake; the SMTP password to the
      # notifier only.
      SENTINEL_DB_MIGRATE_PASSWORD: ""
      SENTINEL_SMTP_PASSWORD: ""
    # Not published: browsers and agents reach it through the proxy service.
    # Distinct priorities: Docker Compose 2.24.6 attaches a container to its
    # networks in an unstable order when they are equal, and then leaves one out
    # at random (docker/compose#11533, fixed in 2.24.7).
    networks:
      default:
        priority: 20
      edge:
        priority: 10
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The application writes nothing to disk; /tmp is the only scratch space.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Gunicorn finishes in-flight requests for up to 30 seconds on SIGTERM.
    stop_grace_period: 40s
    logging: *default-logging

  # The console and the front door: nginx serves the React build and passes
  # what Django serves on to web (deploy/frontend/nginx.conf). No secret, no
  # database: it is on the edge network only.
  proxy:
    build:
      context: ./frontend
      dockerfile: ../deploy/frontend/Dockerfile
      additional_contexts:
        nginx: ./deploy/frontend
    restart: unless-stopped
    init: true
    ports:
      - "${SENTINEL_HTTP_BIND:-0.0.0.0}:${SENTINEL_HTTP_PORT:-8000}:8080"
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
    # The console itself, served by nginx (not through web: it answers while web restarts).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # nginx ends idle connections at once and waits for requests in progress.
    stop_grace_period: 40s
    logging: *default-logging

  alert-engine:
    build: .
    command: ["python", "manage.py", "run_alert_engine", "--liveness-file", "/tmp/sentinel-worker.alive"]
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SENTINEL_DB_ACCESS: runtime
      SENTINEL_PROCESS: worker
      SENTINEL_DB_MIGRATE_PASSWORD: ""
      SENTINEL_SMTP_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # With the default SENTINEL_DB_ROLES web applies the migrations as it starts:
      # the engine waits for them (a long migration must not fail `up`).
      web:
        condition: service_started
    # Instead of the image's Gunicorn probe: each cycle of the engine must begin in time.
    healthcheck:
      test: ["CMD", "python", "-m", "apps.alerts.runtime", "/tmp/sentinel-worker.alive"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # SIGTERM ends the engine after the cycle in progress.
    stop_grace_period: 60s
    logging: *default-logging

  notifier:
    build: .
    command: ["python", "manage.py", "run_notifier", "--liveness-file", "/tmp/sentinel-worker.alive"]
    # Optional: COMPOSE_PROFILES=notifications in .env, with the SMTP settings.
    profiles: ["notifications"]
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SENTINEL_DB_ACCESS: runtime
      SENTINEL_PROCESS: worker
      SENTINEL_DB_MIGRATE_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_started
    # Instead of the image's Gunicorn probe: each run, and each email, must begin in time.
    healthcheck:
      test: ["CMD", "python", "-m", "apps.alerts.runtime", "/tmp/sentinel-worker.alive"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # SIGTERM ends the notifier after the email in progress, which the SMTP
    # timeouts bound (a dozen replies or so at the default 10 s, the first email
    # of a run with STARTTLS and AUTH, then QUIT); the rest of its run is handed
    # back. An email cut short is sent again after its lease.
    stop_grace_period: 180s
    logging: *default-logging

  domain-verifier:
    build: .
    command: ["python", "manage.py", "run_domain_verifier", "--liveness-file", "/tmp/sentinel-worker.alive"]
    # Optional: COMPOSE_PROFILES=web-monitoring in .env. It sends DNS questions
    # (UDP and TCP port 53) to the domains' name servers on the internet.
    profiles: ["web-monitoring"]
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SENTINEL_DB_ACCESS: runtime
      SENTINEL_PROCESS: worker
      SENTINEL_DB_MIGRATE_PASSWORD: ""
      SENTINEL_SMTP_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_started
    # Instead of the image's Gunicorn probe: each cycle must begin in time.
    healthcheck:
      test: ["CMD", "python", "-m", "apps.alerts.runtime", "/tmp/sentinel-worker.alive"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # SIGTERM ends the verifier after the cycle in progress, which the DNS
    # deadline (30 s) bounds; a request cut short is taken again after its lease.
    stop_grace_period: 60s
    logging: *default-logging
