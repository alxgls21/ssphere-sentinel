[project]
name = "ssphere-sentinel"
version = "0.1.0"
description = "Self-hosted infrastructure monitoring and backup verification platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*", "apps*"]
