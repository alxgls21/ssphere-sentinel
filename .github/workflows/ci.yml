name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  server:
    name: Server tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          # Disposable CI database: no password exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Generate throwaway secrets
        run: |
          for name in DJANGO_SECRET_KEY AGENT_TOKEN_PEPPER; do
            value=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Install the server
        run: python -m pip install -e .
      - name: System checks
        run: python manage.py check --fail-level WARNING
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test apps
      - name: Deployment checks with production settings
        env:
          DJANGO_ALLOWED_HOSTS: sentinel.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://sentinel.example.com
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING

  agent:
    name: Agent tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the agent only
        run: python -m pip install ./agent
      - name: No server dependency or Docker SDK is installed
        run: |
          python - <<'EOF'
          import importlib.util, sys
          present = [m for m in ("django", "gunicorn", "psycopg", "whitenoise", "docker")
                     if importlib.util.find_spec(m)]
          sys.exit(f"unexpected packages: {present}" if present else 0)
          EOF
      - name: Tests
        run: python -m unittest discover -s agent/tests -t . -v

  packaging:
    name: Packaging and deployment files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install tools
        run: python -m pip install build==1.6.1 twine==7.0.0 packaging==26.3 pyyaml==6.0.3
      - name: Build both distributions
        run: |
          python -m build --outdir dist/agent agent
          python -m build --outdir dist/server .
      - name: Check distribution metadata
        run: python -m twine check --strict dist/agent/* dist/server/*
      - name: Packaging and deployment-file tests (builds and installs wheels)
        env:
          SENTINEL_TEST_BUILD: "1"
        run: python -m unittest discover -s tests -t . -v

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install tools
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Known vulnerabilities in the server image dependencies
        run: pip-audit --strict --require-hashes --disable-pip -r requirements/server.txt
      - name: Known vulnerabilities in the agent dependencies (with Docker extra)
        run: |
          python -m venv /tmp/agent-env
          /tmp/agent-env/bin/pip install --quiet "./agent[docker]"
          /tmp/agent-env/bin/pip freeze | grep -v '^ssphere-sentinel-agent' > /tmp/agent-requirements.txt
          pip-audit --strict --disable-pip --no-deps -r /tmp/agent-requirements.txt
      - name: Static analysis (high severity)
        run: bandit --recursive agent apps sentinel --exclude '*/tests/*' --severity-level high --confidence-level high

  deployment:
    name: Docker image, Compose stack and systemd agent
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Throwaway environment files
        run: .github/scripts/ci-env.sh
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.tunnel.yml config --quiet
      - name: Build the server image
        run: docker compose build
      - name: Start PostgreSQL and the server
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Check the running server
        run: .github/scripts/check-server.sh
      - name: Deploy the agent with the hardened systemd unit
        run: sudo .github/scripts/agent-systemd-e2e.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
