name: CI

# Every push (branches, not tags), pull requests from forks and manual runs.
# A pull request from a branch of this repository is already covered by the
# push run for the same commit, so the pull_request run skips it: one run per
# commit, whichever way it was opened.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # Supported runtime combinations. The six cells cover every pair of Python,
  # Django and PostgreSQL versions; the experimental cell is allowed to fail.
  server:
    name: Server (Python ${{ matrix.python }}, Django ${{ matrix.django }}, PostgreSQL ${{ matrix.postgres }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.12", django: "5.2", postgres: "16"}
          - {python: "3.12", django: "6.1", postgres: "18"}
          - {python: "3.13", django: "5.2", postgres: "18"}
          - {python: "3.13", django: "6.1", postgres: "16"}
          - {python: "3.14", django: "5.2", postgres: "16"}
          - {python: "3.14", django: "6.1", postgres: "18", primary: true}
          - {python: "3.15", django: "6.1", postgres: "18", experimental: true}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          # Disposable CI database: no password exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Generate throwaway secrets
        run: |
          for name in DJANGO_SECRET_KEY AGENT_TOKEN_PEPPER; do
            value=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Install the server
        run: python -m pip install -e . "Django==${{ matrix.django }}.*"
      # Some server tests run the real agent against the live test server. The
      # agent is its own distribution (it brings psutil, which the server does
      # not use), so it is part of every cell's test environment, as in the
      # development setup of the README, but not of the server's dependencies.
      - name: Install the agent (server tests run it against the live server)
        run: python -m pip install ./agent
      - name: Install the agent's SNMP extra and the SNMP simulator (end-to-end tests)
        if: matrix.primary
        run: python -m pip install "./agent[snmp]" snmpsim pysmi
      - name: Installed versions
        run: python -m pip list --format=freeze | grep -i -E "^(django|psycopg|psycopg-binary|gunicorn|whitenoise|asgiref|sqlparse)=="
      - name: System checks
        run: python manage.py check --fail-level WARNING
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test apps
      - name: Deployment checks with production settings
        if: matrix.primary
        env:
          DJANGO_ALLOWED_HOSTS: sentinel.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://sentinel.example.com
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING

  # The separate database logins (sentinel/db_roles.py, sentinel/database.py,
  # sentinel/postgresql) against a real server of each supported PostgreSQL
  # major version: apps/core/tests/*_postgres.py, every test of which needs the
  # cluster (apps/core/tests/test_postgres_harness.py) and is skipped by the
  # Server job, on a disposable cluster of their own (the logins refuse a
  # cluster that holds anything else), started from that version's programs,
  # which the tests check. Strict: a skipped test, a module that runs nothing or
  # a test database of Django's (none of them uses one) fails the cell. Twice:
  # with the bootstrap password in PGPASSWORD, and in the connection string.
  postgres:
    name: Separate database logins (PostgreSQL ${{ matrix.postgres }}, Django ${{ matrix.django }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
        django: ["5.2", "6.1"]
    env:
      POSTGRES_BINDIR: /usr/lib/postgresql/${{ matrix.postgres }}/bin
      SENTINEL_TEST_POSTGRES_MAJOR: ${{ matrix.postgres }}
      SENTINEL_TEST_PORT: "543${{ matrix.postgres }}"
      # Django's settings name a database, which no test here uses: nothing listens there.
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "9"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Generate throwaway secrets
        run: |
          for name in DJANGO_SECRET_KEY AGENT_TOKEN_PEPPER; do
            value=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Install the server
        run: python -m pip install -e . "Django==${{ matrix.django }}.*"
      - name: Install PostgreSQL ${{ matrix.postgres }} from the PostgreSQL apt repository
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-common
          # A package installed here makes no cluster of its own. The image's PostgreSQL 16 (from
          # the same repository) keeps the one it made, disabled, which nothing here uses.
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends "postgresql-${{ matrix.postgres }}"
          "$POSTGRES_BINDIR/postgres" --version
      - name: Start a disposable cluster
        id: cluster
        run: .github/scripts/postgres-tests.sh start
      # Both runs, whatever the other's outcome, once the cluster runs.
      - name: Tests, with the bootstrap password in PGPASSWORD
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: .github/scripts/postgres-tests.sh run password-free
      - name: Tests, with the bootstrap password in the connection string
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: .github/scripts/postgres-tests.sh run password-in-dsn
      - name: Server log
        if: failure() || cancelled()
        run: cat "$RUNNER_TEMP/sentinel-postgres/server.log" || true
      - name: Stop the cluster
        if: always()
        run: .github/scripts/postgres-tests.sh stop

  agent:
    name: Agent (${{ matrix.os }}, Python ${{ matrix.python }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.11"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: ubuntu-24.04, python: "3.14"}
          - {os: macos-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the agent only
        run: python -m pip install ./agent
      - name: No server dependency or Docker SDK is installed
        run: |
          python - <<'EOF'
          import importlib.util, sys
          present = [m for m in ("django", "gunicorn", "psycopg", "whitenoise", "docker", "pysnmp")
                     if importlib.util.find_spec(m)]
          sys.exit(f"unexpected packages: {present}" if present else 0)
          EOF
      - name: Tests
        run: python -m unittest discover -s agent/tests -t . -v

  # The agent with its optional extras. Docker and SNMP tests run for real
  # (a missing optional dependency would otherwise skip them silently), at the
  # lowest versions the agent declares and at the latest ones.
  agent-extras:
    name: Agent extras (Python ${{ matrix.python }}, ${{ matrix.deps }} dependencies)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", deps: lowest}
          - {python: "3.13", deps: latest}
          - {python: "3.14", deps: latest}
          - {python: "3.15", deps: latest, experimental: true}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the agent with the Docker and SNMP extras
        run: python -m pip install "./agent[docker,snmp]" snmpsim pysmi
      - name: Install the lowest declared versions
        if: matrix.deps == 'lowest'
        run: |
          python .github/scripts/agent-minimum-requirements.py | tee /tmp/lowest.txt
          python -m pip install -r /tmp/lowest.txt
      - name: Installed versions
        run: |
          python -m pip check
          python -m pip list --format=freeze | grep -i -E "^(psutil|docker|pysnmp|cryptography|snmpsim|pysmi|requests|urllib3)=="
      - name: The SNMP simulator is usable (its tests must not be skipped)
        run: python -c "from agent.tests import snmpsim_fixture; reason = snmpsim_fixture.available(); assert reason is None, reason"
      - name: Docker discovery against the runner's Docker daemon
        run: |
          python - <<'EOF'
          from agent.docker_discovery import collect_docker
          result = collect_docker()
          print(result["status"], len(result["containers"]), "container(s)")
          assert result["available"] is True, result
          EOF
      - name: Tests
        run: python -m unittest discover -s agent/tests -t . -v

  packaging:
    name: Packaging and deployment files
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install tools
        run: python -m pip install build==1.6.1 twine==7.0.0 packaging==26.3 pyyaml==6.0.3 shellcheck-py==0.11.0.1
      - name: Build both distributions
        run: |
          python -m build --outdir dist/agent agent
          python -m build --outdir dist/server .
      - name: Check distribution metadata
        run: python -m twine check --strict dist/agent/* dist/server/*
      - name: Shell scripts are lint-clean
        run: shellcheck scripts/*.sh .github/scripts/*.sh entrypoint.sh
      - name: Packaging and deployment-file tests (builds and installs wheels)
        env:
          SENTINEL_TEST_BUILD: "1"
        run: python -m unittest discover -s tests -t . -v

  security:
    name: Security checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install tools
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Known vulnerabilities in the server image dependencies
        run: pip-audit --strict --require-hashes --disable-pip -r requirements/server.txt
      - name: Known vulnerabilities in the agent dependencies (with the Docker and SNMP extras)
        run: |
          python -m venv /tmp/agent-env
          /tmp/agent-env/bin/pip install --quiet "./agent[docker,snmp]"
          /tmp/agent-env/bin/pip freeze | grep -v '^ssphere-sentinel-agent' > /tmp/agent-requirements.txt
          pip-audit --strict --disable-pip --no-deps -r /tmp/agent-requirements.txt
      - name: Static analysis (high severity)
        run: bandit --recursive agent apps sentinel --exclude '*/tests/*' --severity-level high --confidence-level high

  deployment:
    name: Docker image, Compose stack and systemd agent
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Throwaway environment files
        run: .github/scripts/ci-env.sh
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          SENTINEL_POSTGRES=16 docker compose config --quiet
          docker compose -f compose.yml -f compose.tunnel.yml config --quiet
          # A PostgreSQL version without a definition must not resolve to any database.
          if SENTINEL_POSTGRES=17 docker compose config --quiet 2>/dev/null; then
            echo "an unknown PostgreSQL version was accepted" >&2
            exit 1
          fi
      - name: Build the server image
        run: docker compose build
      - name: The preflight accepts a new installation
        run: scripts/postgres-preflight.sh
      - name: Start PostgreSQL and the server
        run: docker compose up --detach --wait --wait-timeout 180
      - name: The preflight recognises the running PostgreSQL 18 installation
        run: scripts/postgres-preflight.sh
      - name: The one-shot migrate service exited 0 with nothing to do
        run: |
          id=$(docker compose ps --all --quiet migrate)
          [ "$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$id")" = "exited 0" ]
          logs=$(docker logs "$id" 2>&1)
          grep 'nothing to do here' <<<"$logs"
      - name: A new installation runs PostgreSQL 18 in the versioned data directory
        run: |
          query() { docker compose exec -T db sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Atc \"$1\""; }
          [ "$(query 'SHOW server_version_num')" -ge 180000 ]
          [ "$(query 'SHOW data_directory')" = /var/lib/postgresql/18/docker ]
      - name: Check the running server
        run: .github/scripts/check-server.sh
      - name: Deploy the agent with the hardened systemd unit
        run: sudo .github/scripts/agent-systemd-e2e.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # Docker Compose releases operators run: 2.20 (the first with include, which
  # the database selection needs), 2.23 (the last before Compose reads env files
  # with compose-go v2) and the current one. With each, the configuration of an
  # existing, a new and a separate-roles installation resolves, and an
  # installation of the previous release is updated with its unchanged .env,
  # restarted and rolled back. (The separate database logins run on the same
  # releases in the job below.)
  compose-compatibility:
    name: Docker Compose ${{ matrix.compose }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compose: ["2.20.0", "2.23.3", "5.6.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The update rehearsal checks out the previous release.
          fetch-depth: 0
      - name: Install Docker Compose ${{ matrix.compose }}
        run: .github/scripts/install-compose.sh "${{ matrix.compose }}"
      - name: The configuration resolves for every kind of installation
        run: .github/scripts/compose-config-check.sh
      - name: Update an installation of the previous release and roll it back
        # It checks out other commits: run a copy from outside the working tree.
        run: |
          cp .github/scripts/compose-upgrade-e2e.sh "$RUNNER_TEMP/"
          "$RUNNER_TEMP/compose-upgrade-e2e.sh"

  # The separate database logins on real containers, with each Docker Compose
  # release above and each PostgreSQL major version a Compose installation can
  # run (16, which an existing installation stays on, and 18). Two ways in: an
  # existing installation moved to the separate logins, and a new installation
  # that starts with them, then what an operator meets: a provisioning killed
  # inside its transaction, a lost acknowledgement, a migration killed halfway,
  # a failed deployment, rotated passwords, drift in the privileges, and the
  # credentials of every container (docs/server-deployment.md). Every scenario
  # is announced and must pass: the judge fails a run that announced more than
  # it passed, and one that is not of the Compose and PostgreSQL versions of its
  # cell. The project (and so its volumes) belongs to the job and is removed
  # whatever happens.
  separate-roles:
    name: Separate database logins (Docker Compose ${{ matrix.compose }}, PostgreSQL ${{ matrix.postgres }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compose: ["2.20.0", "2.23.3", "5.6.0"]
        postgres: ["16", "18"]
    env:
      COMPOSE_PROJECT_NAME: sentinel-roles-e2e
      SENTINEL_E2E_POSTGRES: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Docker Compose ${{ matrix.compose }}
        run: .github/scripts/install-compose.sh "${{ matrix.compose }}"
      - name: Throwaway environment files for PostgreSQL ${{ matrix.postgres }}
        run: .github/scripts/ci-env.sh "${{ matrix.postgres }}"
      - name: The scenarios
        id: scenarios
        run: |
          set -o pipefail
          .github/scripts/separate-roles-e2e.sh 2>&1 | tee "$RUNNER_TEMP/separate-roles-e2e.log"
      - name: Judge the run
        if: ${{ !cancelled() && steps.scenarios.outcome != 'skipped' }}
        run: >
          python3 .github/scripts/compose_e2e.py report --log "$RUNNER_TEMP/separate-roles-e2e.log"
          --postgres "${{ matrix.postgres }}" --compose "${{ matrix.compose }}"
      - name: Container logs
        if: failure() || cancelled()
        run: docker compose logs --no-color --tail 300
      - name: Remove the project, its containers and its volumes
        if: always()
        run: .github/scripts/compose-cleanup.sh

  # The documented move from PostgreSQL 16 to 18, rehearsed end to end: an
  # installation without the new settings stays on 16, PostgreSQL 18 refuses to
  # start on its volume, dump and restore reach 18, and the rollback returns to
  # the untouched 16 volume.
  database-upgrade:
    name: PostgreSQL 16 to 18 migration rehearsal
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Throwaway environment files
        run: .github/scripts/ci-env.sh
      - name: Rehearse the migration
        run: .github/scripts/postgres-upgrade-e2e.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
