# Standalone host agent distribution (ssphere-sentinel-agent).
#
# The agent lives in this directory as the importable package ``agent`` and is
# packaged on its own so monitored hosts never install Django, Gunicorn or a
# PostgreSQL driver. The server distribution is defined in ../pyproject.toml.
#
#   pip install ./agent              # agent only (heartbeats, telemetry, network probes)
#   pip install "./agent[docker]"    # plus optional Docker discovery
#   pip install "./agent[snmp]"      # plus optional SNMP monitoring (v2c and v3)

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssphere-sentinel-agent"
dynamic = ["version"]
description = "Lightweight host agent for SSphere Sentinel: heartbeats, host telemetry, network probes, optional Docker discovery and optional SNMP monitoring"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Alexandros Goulas" }]
dependencies = [
    "psutil>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
# Docker discovery is optional: without the SDK the agent reports Docker as
# unavailable and everything else keeps working.
# The SDK needs 7.1 or later: 7.0.0 cannot talk to Docker with current requests releases.
docker = [
    "docker>=7.1",
]
# SNMP monitoring is optional: without the library the agent reports SNMP as
# unavailable and everything else keeps working. ``cryptography`` is what
# pysnmp uses for SNMPv3 AES privacy; it imports it only when it is present
# and otherwise fails obscurely on the first encrypted request, so it is
# required here rather than left to chance. pysnmp 7.1 needs the AES-CFB mode
# from ``cryptography.hazmat.decrepit``, which exists from cryptography 47.
# pysnmp stays within the 7.1 series because its API changed between minor
# releases.
snmp = [
    "pysnmp>=7.1.30,<7.2",
    "cryptography>=47",
]

[project.scripts]
sentinel-agent = "agent.cli:main"

[project.urls]
Homepage = "https://github.com/alxgls21/ssphere-sentinel"
Documentation = "https://github.com/alxgls21/ssphere-sentinel/blob/main/docs/agent-deployment.md"
Source = "https://github.com/alxgls21/ssphere-sentinel/tree/main/agent"

[tool.setuptools]
# This directory *is* the ``agent`` package; tests/ is not shipped.
package-dir = { "agent" = "." }
packages = ["agent"]

[tool.setuptools.package-data]
agent = ["network_targets.example.json"]

[tool.setuptools.dynamic]
version = { attr = "agent.__version__" }
