# Opt-in Docker monitoring with direct access to the Docker socket.
#
#   sudo install -D -m 0644 docker-monitoring.conf \
#       /etc/systemd/system/sentinel-agent.service.d/docker-monitoring.conf
#   sudo systemctl daemon-reload && sudo systemctl restart sentinel-agent
#
# WARNING: membership of the "docker" group is equivalent to root on the host.
# The agent only reads container metadata, but anyone who can run code as the
# service account could then control Docker. Prefer a read-only socket proxy
# (DOCKER_HOST in agent.env) where possible; see docs/agent-deployment.md.
# Requires the agent installed with the [docker] extra.

[Service]
SupplementaryGroups=docker
