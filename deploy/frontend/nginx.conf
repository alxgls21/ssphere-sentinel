# SSphere Sentinel's front door: the console (the React build) and, on the same
# origin, everything Django serves. The browser and the agents talk to this
# server only: the session and CSRF cookies belong to one site, and there is no
# CORS. TLS is terminated in front of it (Cloudflare Tunnel or a reverse proxy).
#
# Django compares the Origin of a write with the Host it receives, so the Host
# header is passed on unchanged. X-Forwarded-Proto is passed on as received and
# counts only if the operator has Gunicorn trust this server (FORWARDED_ALLOW_IPS,
# off by default); the other forwarding headers are removed (docs/security.md).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Docker's DNS, asked again when the web container is recreated with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://web:8000;

    # An agent's heartbeat is up to 2,500,000 bytes (docs/server-deployment.md).
    client_max_body_size 3m;

    root /usr/share/nginx/html;

    # What Django serves: the console and agent APIs, the admin, its static files, the health checks.
    location ~ ^/(api|admin|static|health)/ {
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        # Longer than Gunicorn's worker timeout (30 s): Gunicorn ends a request first.
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        error_page 502 503 504 = @unavailable;
    }

    # The web service is down or starting: the APIs answer in their own shape.
    location @unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error": {"code": "unavailable", "message": "The server is not available. Try again shortly."}}\n';
    }

    # The console's files carry a hash of their content in their names: kept for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Every other path is the console's (its router reads the URL): index.html, read afresh each time.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
