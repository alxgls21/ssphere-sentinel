# PostgreSQL 18 database service: used when SENTINEL_POSTGRES=18, which
# .env.example sets for new installations.
# The 18 image keeps its cluster in /var/lib/postgresql/18/docker, below a single
# mount at /var/lib/postgresql (which is what lets a later major upgrade use
# pg_upgrade).
#
# Apart from the image, the volume, the initialization guard and the secrets of a
# new installation below (the init service), every version file defines the
# service the same way (tests/deployment checks it).
# The image and the volume belong together: never point a different PostgreSQL
# major version at postgres18_data. docs/server-deployment.md describes the
# supported way to move between versions.

services:
  # The secrets of a new installation, created in ./secrets before the database
  # starts, with the authorization to create its database (sentinel/secrets.py).
  # Nothing to do when .env sets the database password. It sees the database's
  # volume read-only, to refuse new secrets for a database that exists.
  init:
    build: .
    entrypoint: ["python", "-m", "sentinel.secrets", "init"]
    user: "0:0"
    restart: "no"
    network_mode: none
    environment:
      SENTINEL_ENV_SETS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:+yes}
    volumes:
      - ./secrets:/run/sentinel/secrets
      - postgres18_data:/var/lib/postgresql:ro
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      # From .env, or else from the secrets of a new installation (below).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      SENTINEL_POSTGRES_INITIALIZE: ${SENTINEL_POSTGRES_INITIALIZE:-}
    # Initialization guard: a data directory that holds no database is only
    # initialized when SENTINEL_POSTGRES_INITIALIZE=true authorizes it, or the
    # init service, which has just created the secrets of a new installation. A
    # cluster that exists (PG_VERSION, the file the image itself looks for)
    # starts without any setting. The command is stated because overriding the
    # entrypoint drops the image's default command.
    entrypoint:
      - sh
      - -c
      - |
        secrets=$${SENTINEL_SECRETS_DIR:-/run/sentinel/secrets}
        if [ ! -s "$$PGDATA/PG_VERSION" ] && [ "$$SENTINEL_POSTGRES_INITIALIZE" != true ] && [ ! -f "$$secrets/initialize-database" ]; then
          echo "sentinel: $$PGDATA holds no database and creating one is not authorized." >&2
          echo "sentinel: New installation, or restoring a dump into a new volume: set SENTINEL_POSTGRES_INITIALIZE=true in .env." >&2
          echo "sentinel: Existing installation: do not authorize this, the wrong volume is mounted. Run scripts/postgres-preflight.sh." >&2
          exit 1
        fi
        if [ -z "$$POSTGRES_PASSWORD" ]; then
          if [ ! -s "$$secrets/postgres_password" ]; then
            echo "sentinel: POSTGRES_PASSWORD is not set in .env, and $$secrets/postgres_password does not exist (the init service creates it for a new installation)." >&2
            exit 1
          fi
          POSTGRES_PASSWORD=$$(cat "$$secrets/postgres_password")
          export POSTGRES_PASSWORD
        fi
        exec docker-entrypoint.sh "$$@"
      - sentinel-initialization-guard
    command: ["postgres"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./secrets:/run/sentinel/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # The image stops PostgreSQL with a fast shutdown; give it time to finish
    # instead of being killed after Docker's default 10 seconds.
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres18_data:
